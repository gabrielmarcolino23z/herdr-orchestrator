# herdr-orchestrator: mise shims on the graphical session's PATH, so herdr-app / herdr-core and the
# terminals they start find node, bun, codex… (they don't read your shell's rc file).
# "zz" so it is applied after /usr/lib/environment.d/99-environment.conf, which resets PATH.
PATH=$HOME/.local/share/mise/shims:$HOME/.local/bin:$PATH
